    contents:
      - add_marker
      - add_markers
      - add_circle_markers
      - add_marker_cluster
      - add_heatmap
      - add_xy_data
      - add_csv
  - title: Rasters, tiles, and services
    contents:
      - add_raster
      - add_cog
      - add_tile_layer
      - add_wms
      - add_wmts
      - add_wfs
      - add_vector_tiles
      - add_pmtiles
      - add_3d_tiles
      - add_video
