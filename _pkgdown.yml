url: https://r.geolibre.app/
template:
  bootstrap: 5
navbar:
  structure:
    left: [intro, reference, articles, news]
  components:
    articles:
      text: Interactive map
      href: articles/interactive-map.html
articles:
  - title: Interactive examples
    contents:
      - articles/interactive-map
reference:
  - title: Create a map
    contents: [geolibre]
  - title: Vector layers
    desc: >
      Vector data from GeoJSON, `sf`, or any format the browser can stream.
    contents:
      - add_geojson
      - add_sf
      - add_data
      - add_choropleth
      - add_vector
      - add_geoparquet
      - add_flatgeobuf
      - add_shp
